import groovy.json.JsonSlurper

// The expected profile is reviewed alongside tests; the reporter records runtime IDs.
def runToken = UUID.randomUUID().toString()
def runDirectory = layout.buildDirectory.dir('gametest/' + runToken)
def executionReport = runDirectory.map { it.file('execution.json') }
def expectedProfile = file('gametest/profiles/full.txt')

minecraft.runs.gameTestServer.property('bc.gametest.better_chemlib_hazards.report', executionReport.get().asFile.absolutePath)

minecraft.runs.gameTestServer.workingDirectory(runDirectory.get().asFile)
minecraft.runs.gameTestServer.property('bc.gametest.better_chemlib_hazards.runToken', runToken)

def validateExecution = { File reportFile, List<String> expected, String token ->
        if (!expected || expected.toSet().size() != expected.size()) {
            throw new GradleException('GameTest profile must contain unique, nonempty expected IDs')
        }
        if (!reportFile.isFile()) throw new GradleException("Missing fresh GameTest execution report: ${reportFile}")
        def report = new JsonSlurper().parse(reportFile)
        if (report.run_token != token) throw new GradleException('Stale GameTest execution token')
        if (report.profile != 'full' || report.finished != true) {
            throw new GradleException('GameTest run did not finish the full profile')
        }
        def registered = report.registered
        def executed = report.results.collect { it.id }
        if (registered.sort() != expected.sort() || executed.sort() != expected.sort()) {
            throw new GradleException("Incomplete GameTest profile. Expected=${expected}; registered=${registered}; executed=${executed}")
        }
        def failures = report.results.findAll { it.status != 'passed' }
        if (failures) throw new GradleException("GameTests failed: ${failures}")
}

// A fresh GameTest directory must have a readable settings input. Absence makes
// native Settings.loadFromFile report ERROR before default recovery; no overrides are needed.
def prepareServerProperties = { File properties ->
    if (!properties.exists()) {
        properties.parentFile.mkdirs()
        properties.text = '# Fresh source GameTest fixture: native defaults, no overrides.\n'
    }
}

// Exact defaults emitted by pinned AdPother 8.1.49.0-build.2294. An absent
// common TOML is corrected after Forge installs its watcher, firing a reload
// that races AdPother's main-thread creation of the per-source CFG files.
// Supply the complete, unchanged defaults before Forge starts; watching and
// ordinary reload behavior remain enabled. A schema change must be reviewed.
def adPotherDefaults = file('gametest/config/adpother-common.toml')
def defaultsSha256 = 'd255babc81f6729ce3442522c76cab2a05f960b496f292fdc0371af69745f514'
def sha256 = { File input -> java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() }
def prepareAdPotherDefaults = { File target, File source = adPotherDefaults ->
    if (!source.isFile() || sha256(source) != defaultsSha256)
        throw new GradleException('Pinned native AdPother defaults changed or are missing')
    if (target.exists()) {
        if (!target.isFile()) throw new GradleException('Native AdPother config is not a regular file')
        return // Never overwrite authored settings or reuse/repair old evidence.
    }
    target.parentFile.mkdirs()
    java.nio.file.Files.copy(source.toPath(), target.toPath())
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        prepareServerProperties(runDirectory.get().file('server.properties').asFile)
        prepareAdPotherDefaults(runDirectory.get().file('config/adpother-common.toml').asFile)
        java.nio.file.Files.deleteIfExists(executionReport.get().asFile.toPath())
        copy {
            from(file('src/main/resources/gameteststructures').isDirectory() ? file('src/main/resources/gameteststructures') : file('gameteststructures'))
            into(runDirectory.get().dir('gameteststructures'))
        }
    }
    doLast {
        def expected = expectedProfile.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
        validateExecution(executionReport.get().asFile, expected, runToken)
        def defaults = runDirectory.get().file('config/adpother-common.toml').asFile
        if (!defaults.isFile() || sha256(defaults) != defaultsSha256)
            throw new GradleException('Native AdPother corrected or changed the reviewed complete defaults')
        logger.lifecycle("Verified ${expected.size()} executed GameTests in profile full: ${executionReport.get().asFile}")
    }
}

// Exercise the same parser without launching Forge for each negative case.
tasks.register('verifyGameTestEvidenceGuard') {
    group = 'verification'
    doLast {
        def fixture = layout.buildDirectory.file('gametest-guard-fixtures/execution.json').get().asFile
        fixture.parentFile.mkdirs()
        def valid = [profile: 'full', run_token: 'current', finished: true,
                     registered: ['required'], results: [[id: 'required', status: 'passed']]]
        fixture.text = groovy.json.JsonOutput.toJson(valid)
        validateExecution(fixture, ['required'], 'current')
        def invalid = [
            valid + [run_token: 'previous'], valid + [finished: false],
            valid + [registered: []], valid + [registered: ['other']],
            valid + [results: []], valid + [results: [[id: 'other', status: 'passed']]],
            valid + [results: [[id: 'required', status: 'failed']]],
            valid + [results: [[id: 'required', status: 'passed'], [id: 'required', status: 'passed']]],
            valid + [registered: [], results: []]
        ].collect { groovy.json.JsonOutput.toJson(it) } + ['{"profile":']
        invalid.each { payload ->
            fixture.text = payload
            boolean rejected = false
            try { validateExecution(fixture, ['required'], 'current') } catch (Exception expected) { rejected = true }
            if (!rejected) throw new GradleException("Execution guard accepted invalid evidence: ${payload}")
        }
        java.nio.file.Files.deleteIfExists(fixture.toPath())
        boolean rejectedMissing = false
        try { validateExecution(fixture, ['required'], 'current') } catch (Exception expected) { rejectedMissing = true }
        if (!rejectedMissing) throw new GradleException('Execution guard accepted missing evidence')
        def properties = layout.buildDirectory.file('gametest-guard-fixtures/' + runToken + '/server.properties').get().asFile
        prepareServerProperties(properties)
        if (!properties.isFile() || !properties.readLines().every { !it || it.startsWith('#') })
            throw new GradleException('Fresh GameTest properties must exist without overriding native defaults')
        properties.text = 'max-tick-time=123456\n'
        prepareServerProperties(properties)
        if (properties.text != 'max-tick-time=123456\n')
            throw new GradleException('GameTest preparation overwrote existing properties')
        def seedRoot = layout.buildDirectory.dir('gametest-guard-fixtures/' + runToken + '/adpother').get().asFile
        def target = new File(seedRoot, 'config/adpother-common.toml')
        prepareAdPotherDefaults(target)
        if (sha256(target) != defaultsSha256) throw new GradleException('Incomplete native config seed')
        target.text = 'globalEmissionRate = 0.5\n'
        prepareAdPotherDefaults(target)
        if (target.text != 'globalEmissionRate = 0.5\n') throw new GradleException('Authored native config overwritten')
        def invalidSource = new File(seedRoot, 'incomplete.toml')
        invalidSource.text = 'globalEmissionRate = 1.0\n'
        def absentTarget = new File(seedRoot, 'must-remain-absent.toml')
        boolean badSeedRejected = false
        try { prepareAdPotherDefaults(absentTarget, invalidSource) } catch (GradleException expected) { badSeedRejected = true }
        if (!badSeedRejected || absentTarget.exists()) throw new GradleException('Unreviewed partial defaults admitted')
        def directoryTarget = new File(seedRoot, 'directory.toml')
        directoryTarget.mkdirs()
        boolean directoryRejected = false
        try { prepareAdPotherDefaults(directoryTarget) } catch (GradleException expected) { directoryRejected = true }
        if (!directoryRejected || !directoryTarget.isDirectory()) throw new GradleException('Non-file config not preserved/rejected')
        logger.lifecycle('GameTest execution guard rejected 11 invalid/missing evidence cases; properties and pinned default seed absence/preservation/integrity checked')
    }
}
tasks.matching { it.name == 'verifyFast' }.configureEach { dependsOn('verifyGameTestEvidenceGuard') }
